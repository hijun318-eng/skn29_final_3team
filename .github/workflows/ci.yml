name: CI

on:
  push:
    branches: [dev, junhee, seung, daesung, jaehong, minji]

permissions:
  contents: read

jobs:
  role-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.gate.outputs.scope }}
      handoff: ${{ steps.gate.outputs.handoff }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check role scope
        id: gate
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            base="${{ github.event.before }}"
            mode="direct"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          else
            git fetch origin dev:refs/remotes/origin/dev
            base="origin/dev"
            mode="merge-base"
          fi
          python .github/scripts/gate_scope.py \
            --branch "$GITHUB_REF_NAME" \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --mode "$mode"
          separator=".."
          if [[ "$mode" == "merge-base" ]]; then
            separator="..."
          fi
          git diff --check "${base}${separator}${GITHUB_SHA}"
      - name: Write R1 dashboard
        run: python .github/scripts/gate_scope.py --dashboard --next-gate I2

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: python -m pip install pytest -r app/backend/requirements.txt
      - run: python -m compileall -q .github/scripts app/backend src tests
      - run: python -m pytest -p no:cacheprovider tests

  document-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .agents/skills/manage-project-documents/scripts/check_document_policy.py docs/markdown/01_요구사항정의서.md docs/markdown/02_WBS.md docs/markdown/05_화면설계서.md docs/markdown/collaboration/Gate_실행_카드_원장.md docs/markdown/collaboration/I0_결정_및_I1_공통_계약_원장.md docs/markdown/collaboration/I1_평가_원장.md
      - run: python .agents/skills/update-project-wbs/scripts/validate_wbs.py docs/markdown/02_WBS.md
      - run: python .agents/skills/update-project-reports/scripts/validate_reports.py docs/markdown/daily_reports/*/일일보고.md

  frontend-contracts:
    if: github.ref_name == 'minji' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/enterprise-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/enterprise-react/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test ../../tests/frontend/contracts.test.mjs

  compose-config:
    if: github.ref_name == 'junhee' || github.ref_name == 'seung' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Docker Compose version
        run: docker compose version
      - run: pwsh -File infrastructure/database/scripts/verify-service-fragment.ps1 -EnvFilePath .env.example
      - run: docker compose -f compose.yml --env-file .env.example --profile dev config --quiet
      - run: docker compose -f compose.yml --env-file .env.example --profile full config --quiet
      - run: docker compose -f compose.yml --env-file .env.example --profile split-host config --quiet

  quality-gate:
    if: always()
    needs:
      - role-scope
      - python-contracts
      - document-quality
      - frontend-contracts
      - compose-config
    runs-on: ubuntu-latest
    env:
      ROLE_SCOPE: ${{ needs['role-scope'].result }}
      PYTHON_CONTRACTS: ${{ needs['python-contracts'].result }}
      DOCUMENT_QUALITY: ${{ needs['document-quality'].result }}
      FRONTEND_CONTRACTS: ${{ needs['frontend-contracts'].result }}
      COMPOSE_CONFIG: ${{ needs['compose-config'].result }}
      HANDOFF: ${{ needs['role-scope'].outputs.handoff }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Summarize project quality
        shell: bash
        run: |
          {
            echo "## Project quality gate"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Role scope | ${ROLE_SCOPE} |"
            echo "| Python/contracts | ${PYTHON_CONTRACTS} |"
            echo "| Documents/WBS | ${DOCUMENT_QUALITY} |"
            echo "| Frontend | ${FRONTEND_CONTRACTS} |"
            echo "| Compose | ${COMPOSE_CONFIG} |"
            echo "| Handoff | ${HANDOFF:-NOT_RUN} |"
            echo
            echo "Handoff \`FAIL\` blocks this gate. \`NOT_RUN\` and \`REVIEW_REQUIRED\` are R1 review items and do not block."
            echo
            echo "R1 still decides product acceptance, contract freeze, exceptions, and the final Gate."
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$ROLE_SCOPE" \
            "$PYTHON_CONTRACTS" \
            "$DOCUMENT_QUALITY" \
            "$FRONTEND_CONTRACTS" \
            "$COMPOSE_CONFIG"
          do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done

          # 차단 대상은 handoff 증거의 무결성 위반(FAIL)뿐이다.
          # NOT_RUN(미제출)과 REVIEW_REQUIRED(미실행 검증·change request·
          # 잔여 위험·외부 승인 요청)는 R1 검토 큐 항목이며 CI를 차단하지 않는다.
          if [[ "$BRANCH" != "dev" && "$HANDOFF" == "FAIL" ]]; then
            echo "Handoff evidence is invalid. See the role scope summary." >&2
            exit 1
          fi

          if [[ "$BRANCH" != "dev" && "$HANDOFF" != "PASS" && "$HANDOFF" != "N/A" ]]; then
            echo "::notice::Handoff is ${HANDOFF}. R1 review required; this does not block the gate."
          fi
