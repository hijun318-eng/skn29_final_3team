name: CI

on:
  push:
    branches: [dev, test, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: python -m pip install pytest -r app/backend/requirements.txt
      - run: python -m compileall -q app/backend src tests
      - run: python -m pytest -p no:cacheprovider tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/enterprise-react
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/enterprise-react/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test ../../tests/frontend/contracts.test.mjs

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Show Docker Compose version
        run: docker compose version
      - run: pwsh -File infrastructure/database/scripts/verify-service-fragment.ps1 -EnvFilePath .env.example
      - run: docker compose -f compose.yml --env-file .env.example --profile dev config --quiet
      - run: docker compose -f compose.yml --env-file .env.example --profile full config --quiet
      - run: docker compose -f compose.yml --env-file .env.example --profile split-host config --quiet

  quality:
    if: always()
    needs: [python-tests, frontend, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHON_TESTS: ${{ needs.python-tests.result }}
      FRONTEND: ${{ needs.frontend.result }}
      COMPOSE_CONFIG: ${{ needs.compose-config.result }}
    steps:
      - name: Summarize project quality
        shell: bash
        run: |
          {
            echo "## Project quality"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Python tests | ${PYTHON_TESTS} |"
            echo "| Frontend | ${FRONTEND} |"
            echo "| Compose config | ${COMPOSE_CONFIG} |"
            echo
            echo "Container-based Golden Path E2E is added when Slice 1 is implemented."
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$PYTHON_TESTS" "$FRONTEND" "$COMPOSE_CONFIG"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
