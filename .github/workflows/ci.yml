# 책임: architecture·무결성·문서화·테스트·Compose 확장을 순서대로 검증하며,
# 어느 gate라도 실패하면 배포 가능한 변경으로 인정하지 않는다.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/backend/requirements.lock.txt
            infrastructure/database/datahub/requirements.authoring.txt
      - run: >-
          python -m pip install pytest
          --constraint app/backend/requirements.lock.txt
          -r app/backend/requirements.txt
          -r infrastructure/database/datahub/requirements.authoring.txt
      - run: python scripts/lint_architectural_invariants.py
      # Repository-wide policy audit catches request-specific artifacts and
      # runtime secret fixtures that a single-language AST pass cannot see.
      - run: python scripts/audit_repository_integrity.py
      # Public APIs and non-obvious invariants must remain documented as the
      # architecture is split into smaller domain modules.
      - run: python scripts/check_code_documentation.py
      - run: python app/backend/scripts/export_openapi.py --check
      - run: python -m compileall -q app/backend src infrastructure/database/datahub tests
      - name: Reject whitespace errors in the submitted commit range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}")"
            fi
          fi
          git diff --check "$base...$head"
      # Optional RAG and Node2 worker runtimes own separate dependency sets and
      # gates below. The core gate must not depend on GPU/model packages.
      - run: >-
          python -m pytest -p no:cacheprovider tests -q
          --ignore=tests/rag
          --ignore=tests/ai/test_node2_serverless_worker.py
          --ignore=tests/ai/test_training_dataset.py
          --ignore=tests/backend/test_ml_prediction_integration.py
          --ignore=tests/ml
          --basetemp=.tmp/pytest-core-ci-${{ github.run_id }}-${{ github.run_attempt }}

  ml-runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: app/backend:.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/ml/room_demand_v3/requirements.txt
            .github/workflows/ci.yml
      # Serving image의 exact ML pins를 정본으로 사용한다. Backend lock은
      # psycopg·uvicorn 버전이 달라 이 격리 runtime gate와 결합하지 않는다.
      - name: Install pinned ML runtime test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.0
          SQLAlchemy==2.0.52
          -r src/ml/room_demand_v3/requirements.txt
      - run: python -m pip check
      # 외부 Trino·model API를 호출하지 않고 frozen v2.2 Artifact의 실제 load,
      # Backend/runtime 경계 48개와 경량 ML unit을 sklearn 1.9.0에서 검증한다.
      - name: Verify frozen ML serving and Backend contracts
        run: >-
          python -m pytest -p no:cacheprovider
          tests/backend/test_ml_prediction_integration.py
          tests/ml -q
          --basetemp=.tmp/pytest-ml-runtime-ci

  rag-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infrastructure/rag/requirements.txt
      # CPU 계약 검증에는 실제 embedding model weight와 torch가 필요하지 않다.
      - run: python -m pip install pytest -r infrastructure/rag/requirements.txt
      - run: >-
          python -m pytest -p no:cacheprovider tests/rag -q
          --basetemp=.tmp/pytest-rag-ci-${{ github.run_id }}-${{ github.run_attempt }}

  node2-serverless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_receipt: ${{ steps.image-receipt.outcome }}
      training_contract: ${{ steps.training-contract.outcome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/node2_qwen35_2b_full3000_serverless-cu129.lock.txt
      # Worker module import에 필요한 경량 HTTP runtime만 설치한다. GPU/vLLM
      # image 계약은 source-bound 정적 receipt로 별도 검증한다.
      - run: python -m pip install pytest aiohttp==3.14.3
      - name: Verify inactive Node2 worker contracts
        run: >-
          python -m pytest -p no:cacheprovider
          tests/ai/test_node2_serverless_worker.py -q
          -k "not test_local_image_receipt_is_source_bound_and_not_a_gpu_pass"
          --basetemp=.tmp/pytest-node2-contract-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # compiler_only App 경로를 막지는 않되, 별도 sLLM 작업이 갱신해야 할
      # candidate evidence를 CI summary에서 계속 보이게 한다.
      - name: Check inactive Node2 image receipt
        id: image-receipt
        continue-on-error: true
        run: >-
          python -m pytest -p no:cacheprovider
          tests/ai/test_node2_serverless_worker.py::test_local_image_receipt_is_source_bound_and_not_a_gpu_pass
          -q
          --basetemp=.tmp/pytest-node2-image-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check inactive Node2 training contract
        id: training-contract
        continue-on-error: true
        run: >-
          python -m pytest -p no:cacheprovider
          tests/ai/test_training_dataset.py -q
          --basetemp=.tmp/pytest-node2-training-ci-${{ github.run_id }}-${{ github.run_attempt }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Show Docker Compose version
        run: docker compose version
      # Compose expansion is the contract: no checked-in service inventory JSON
      # is allowed to become a second, manually synchronized source of truth.
      - name: Validate fail-closed Trino access rules
        run: python -m json.tool infrastructure/database/trino/etc/access-control-rules.json >/dev/null
      - run: docker compose -f compose.yml --env-file infrastructure/database/.env.example --profile dev config --quiet
      - run: docker compose -f compose.yml --env-file infrastructure/database/.env.example --profile full config --quiet
      - run: docker compose -f compose.yml --env-file infrastructure/database/.env.example --profile split-host config --quiet
      - name: Validate approved ML runtime profile
        run: >-
          docker compose -f compose.yml
          --env-file infrastructure/database/.env.example
          --profile full --profile ml
          config --quiet
      - name: Validate ML candidate split-host profile
        run: >-
          docker compose -f compose.yml
          --env-file infrastructure/database/.env.example
          --profile split-host --profile ml-candidate
          config --quiet
      - name: Validate approved RAG runtime profile
        run: >-
          docker compose -f compose.yml
          --env-file infrastructure/database/.env.example
          --profile full --profile rag
          config --quiet
      - name: Validate RAG candidate split-host profile
        run: >-
          docker compose -f compose.yml
          --env-file infrastructure/database/.env.example
          --profile split-host --profile rag-candidate
          config --quiet
      - name: Validate isolated RAG E2E profile
        run: >-
          docker compose -f compose.yml
          --env-file infrastructure/database/.env.example
          --profile full --profile rag-e2e
          config --quiet
      - name: Validate production semantic-search merge
        run: >-
          docker compose
          --env-file infrastructure/database/.env.example
          -f compose.yml
          -f infrastructure/database/datahub/compose.semantic-search.yml
          --profile full
          --profile semantic-search
          config --quiet
      # override 파일은 텍스트 assert만으로는 병합 실패를 잡지 못한다. 실제 전개까지
      # 확인해야 root compose 변경이 override의 service·env 이름을 깨뜨린 경우가 드러난다.
      - name: Validate app-postgres override merge
        run: >-
          docker compose
          --env-file infrastructure/database/.env.example
          -f compose.yml
          -f compose.app-postgres.override.yml
          --profile full
          config --quiet
      # start.ps1의 Catalog stage가 실제로 결합하는 조합이다. ingestion fragment는 다른
      # 어떤 CI 단계에서도 전개되지 않으므로 여기서만 병합 계약이 검증된다.
      - name: Validate metadata-ingestion catalog merge
        env:
          SEMANTIC_PRODUCER_BUILD_CONTEXT: ${{ github.workspace }}
        run: >-
          docker compose
          --env-file infrastructure/database/.env.example
          -f infrastructure/database/compose.yml
          -f infrastructure/database/datahub/compose.consumer.yml
          -f infrastructure/database/datahub/compose.ingestion.yml
          --profile full
          --profile metadata-ingestion
          config --quiet

  quality:
    if: always()
    needs:
      [python-tests, ml-runtime-tests, rag-tests, node2-serverless-tests, frontend, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHON_TESTS: ${{ needs.python-tests.result }}
      ML_RUNTIME_TESTS: ${{ needs.ml-runtime-tests.result }}
      RAG_TESTS: ${{ needs.rag-tests.result }}
      NODE2_SERVERLESS_TESTS: ${{ needs.node2-serverless-tests.result }}
      NODE2_IMAGE_RECEIPT: ${{ needs.node2-serverless-tests.outputs.image_receipt }}
      NODE2_TRAINING_CONTRACT: ${{ needs.node2-serverless-tests.outputs.training_contract }}
      FRONTEND: ${{ needs.frontend.result }}
      COMPOSE_CONFIG: ${{ needs.compose-config.result }}
    steps:
      - name: Summarize project quality
        shell: bash
        run: |
          {
            echo "## Project quality"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Python core tests | ${PYTHON_TESTS} |"
            echo "| ML runtime tests | ${ML_RUNTIME_TESTS} |"
            echo "| RAG tests | ${RAG_TESTS} |"
            echo "| Node2 serverless tests | ${NODE2_SERVERLESS_TESTS} |"
            echo "| Node2 inactive image receipt | ${NODE2_IMAGE_RECEIPT} |"
            echo "| Node2 inactive training contract | ${NODE2_TRAINING_CONTRACT} |"
            echo "| Frontend | ${FRONTEND} |"
            echo "| Compose config | ${COMPOSE_CONFIG} |"
            echo
            echo "Container-based Golden Path E2E is added when Slice 1 is implemented."
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$PYTHON_TESTS" \
            "$ML_RUNTIME_TESTS" \
            "$RAG_TESTS" \
            "$NODE2_SERVERLESS_TESTS" \
            "$FRONTEND" \
            "$COMPOSE_CONFIG"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
