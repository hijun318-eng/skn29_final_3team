name: CI

on:
  push:
    branches: [dev, test, junhee, seung, daesung, jaehong, minji]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: python -m pip install pytest -r app/backend/requirements.txt
      - run: python -m compileall -q app/backend src tests
      - run: python -m pytest -p no:cacheprovider tests

  frontend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/enterprise-react
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/enterprise-react/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:contracts

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - run: pwsh -File infrastructure/database/scripts/verify-service-fragment.ps1 -EnvFilePath .env.example
      - run: docker compose -f compose.yml --env-file .env.example --profile dev config --quiet
      - run: docker compose -f compose.yml --env-file .env.example --profile full config --quiet
      - run: docker compose -f compose.yml --env-file .env.example --profile split-host config --quiet

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: app/backend/requirements.txt
      - name: Audit Node dependencies
        working-directory: app/enterprise-react
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: answervice.cdx.json
          version: v0.70.0
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: answervice-cyclonedx-sbom
          path: answervice.cdx.json
          retention-days: 30
      - name: Build application images
        run: |
          docker build -f app/backend/Dockerfile -t answervice-backend:${{ github.sha }} .
          docker build -f app/enterprise-react/Dockerfile -t answervice-frontend:${{ github.sha }} app/enterprise-react
      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: answervice-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "1"
          version: v0.70.0
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: answervice-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "1"
          version: v0.70.0

  quality-gate:
    if: always()
    needs: [python-contracts, frontend-contracts, compose-config, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a product check failed
        env:
          PYTHON_CONTRACTS: ${{ needs.python-contracts.result }}
          FRONTEND_CONTRACTS: ${{ needs.frontend-contracts.result }}
          COMPOSE_CONFIG: ${{ needs.compose-config.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        shell: bash
        run: |
          for result in "$PYTHON_CONTRACTS" "$FRONTEND_CONTRACTS" "$COMPOSE_CONFIG" "$SUPPLY_CHAIN"; do
            [[ "$result" == "success" ]] || exit 1
          done
