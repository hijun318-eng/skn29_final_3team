name: CI

on:
  push:
    branches: [dev, junhee, seung, daesung, jaehong, minji]

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: python -m pip install pytest -r app/backend/requirements.txt
      - run: python -m pytest -p no:cacheprovider tests
      - run: python .agents/skills/manage-project-documents/scripts/check_document_policy.py docs/markdown/01_요구사항정의서.md docs/markdown/02_WBS.md docs/markdown/05_화면설계서.md docs/markdown/collaboration/Gate_실행_카드_원장.md docs/markdown/collaboration/I0_결정_및_I1_공통_계약_원장.md docs/markdown/collaboration/I1_평가_원장.md
      - run: python .agents/skills/update-project-wbs/scripts/validate_wbs.py docs/markdown/02_WBS.md
      - run: python .agents/skills/update-project-reports/scripts/validate_reports.py docs/markdown/daily_reports/*/일일보고.md
