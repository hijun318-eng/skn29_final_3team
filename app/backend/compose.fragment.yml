# 책임: migration과 runtime DB identity를 분리하고 migration 성공 및 외부 인증
# secret mount가 확인된 뒤에만 backend를 시작한다.
services:
  app-migrations:
    profiles: [dev, full, split-host]
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
      args:
        ANSWERVICE_SOURCE_REVISION: ${ANSWERVICE_SOURCE_REVISION:-}
        ANSWERVICE_SOURCE_DIRTY: ${ANSWERVICE_SOURCE_DIRTY:-}
        ANSWERVICE_SOURCE_FINGERPRINT: ${ANSWERVICE_SOURCE_FINGERPRINT:-}
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    environment:
      # The bootstrap admin only creates the migration role. Alembic itself runs
      # with the schema-changing identity and never carries superuser credentials.
      APP_DATABASE_URL: postgresql+psycopg://${APP_MIGRATION_USER}:${APP_MIGRATION_PASSWORD}@app-postgres:5432/${APP_DB_NAME:-app_db}
      APP_DB_USER: ${APP_DB_USER}
      APP_CATALOG_PUBLISHER_USER: ${APP_CATALOG_PUBLISHER_USER}
      TZ: Asia/Seoul
    networks:
      - database-network
    depends_on:
      app-postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: [dev, full, split-host]
    container_name: answervice-backend
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
      args:
        ANSWERVICE_SOURCE_REVISION: ${ANSWERVICE_SOURCE_REVISION:-}
        ANSWERVICE_SOURCE_DIRTY: ${ANSWERVICE_SOURCE_DIRTY:-}
        ANSWERVICE_SOURCE_FINGERPRINT: ${ANSWERVICE_SOURCE_FINGERPRINT:-}
    environment:
      # Runtime receives only its table-scoped account. Migration credentials
      # are confined to the one-shot app-migrations service above.
      APP_RUNTIME_DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@app-postgres:5432/${APP_DB_NAME:-app_db}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_HOST: app-postgres
      APP_DB_PORT: "5432"
      TRINO_URL: https://trino:8443
      TRINO_RUNTIME_USER: ${TRINO_RUNTIME_USER:?TRINO_RUNTIME_USER is required}
      TRINO_RUNTIME_PASSWORD: ${TRINO_RUNTIME_PASSWORD:?TRINO_RUNTIME_PASSWORD is required}
      TRINO_TLS_CA_FILE: /run/secrets/trino-ca.pem
      ML_RUNTIME_URL: ${ML_RUNTIME_URL:-http://ml-runtime:8000}
      ML_RUNTIME_TIMEOUT_SECONDS: ${ML_RUNTIME_TIMEOUT_SECONDS:-90}
      ML_RUNTIME_HMAC_SECRET: ${ML_RUNTIME_HMAC_SECRET:-}
      ML_APPROVED_MODEL_VERSION: ${ML_APPROVED_MODEL_VERSION:-}
      ML_APPROVED_MODEL_SHA256: ${ML_APPROVED_MODEL_SHA256:-}
      ML_APPROVED_FEATURE_CONTRACT_SHA256: ${ML_APPROVED_FEATURE_CONTRACT_SHA256:-}
      # 합성 후보를 로컬 검증 UI에 노출할 때만 true로 명시한다. 기본값은 운영 차단이다.
      ML_ALLOW_CONDITIONAL: ${ML_ALLOW_CONDITIONAL:-false}
      ML_FEATURE_ENABLED: ${ML_FEATURE_ENABLED:-0}
      # 외부 Supervisor는 원본 command admission과 capability 재검증이 가능한 환경에서만 연다.
      SUPERVISOR_FEATURE_ENABLED: ${SUPERVISOR_FEATURE_ENABLED:-0}
      SUPERVISOR_OPENAI_ENDPOINT: ${OPENAI_ENDPOINT:-}
      SUPERVISOR_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPERVISOR_OPENAI_MODEL: ${SUPERVISOR_OPENAI_MODEL:-gpt-5.6-terra}
      SUPERVISOR_REASONING_EFFORT: ${SUPERVISOR_REASONING_EFFORT:-low}
      SUPERVISOR_TIMEOUT_SECONDS: ${SUPERVISOR_TIMEOUT_SECONDS:-15}
      DATAHUB_GMS_URL: https://datahub-gms:8443
      DATAHUB_READ_API_TOKEN: ${DATAHUB_READ_API_TOKEN:?DATAHUB_READ_API_TOKEN is required}
      DATAHUB_READ_ACTOR_URN: ${DATAHUB_READ_ACTOR_URN:?DATAHUB_READ_ACTOR_URN is required}
      DATAHUB_TLS_CA_FILE: /run/secrets/datahub-ca.pem
      # Metadata-only 운영은 lexical을 명시하고 semantic rollout 뒤에만 hybrid로 바꾼다.
      DATAHUB_SEARCH_MODE: ${DATAHUB_SEARCH_MODE:-datahub_lexical}
      # 과거 데이터의 metadata snapshot과 release receipt는 같은 하루 TTL을 사용한다.
      # Semantic release 발행 시 Backend를 재기동하며 만료 뒤 실패는 stale 성공으로 숨기지 않는다.
      DATAHUB_CATALOG_TTL_SECONDS: ${DATAHUB_CATALOG_TTL_SECONDS:-86400}
      RELEASE_READINESS_CACHE_TTL_SECONDS: ${RELEASE_READINESS_CACHE_TTL_SECONDS:-86400}
      RELEASE_READINESS_TIMEOUT_SECONDS: ${RELEASE_READINESS_TIMEOUT_SECONDS:-60}
      ANALYTICS_CONTEXT_RELEASE: ${ANALYTICS_CONTEXT_RELEASE:-}
      OPENAI_ENDPOINT: ${OPENAI_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      NODE2_MODEL_ENDPOINT: ${NODE2_MODEL_ENDPOINT:-}
      NODE2_MODEL_API_TOKEN: ${NODE2_MODEL_API_TOKEN:-}
      NODE2_MODEL: ${NODE2_MODEL:-}
      REPORT_SCHEDULER_ENABLED: ${REPORT_SCHEDULER_ENABLED:-1}
      REPORT_SCHEDULER_POLL_SECONDS: ${REPORT_SCHEDULER_POLL_SECONDS:-5}
      REPORT_SCHEDULER_BATCH_SIZE: ${REPORT_SCHEDULER_BATCH_SIZE:-50}
      READINESS_PROBE_TIMEOUT_SECONDS: ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
      NODE2_MODEL_PROVIDER: ${NODE2_MODEL_PROVIDER:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      NODE2_MODEL_TIMEOUT_SECONDS: ${NODE2_MODEL_TIMEOUT_SECONDS:-90}
      ANALYSIS_SQL_GENERATION_MODE: ${ANALYSIS_SQL_GENERATION_MODE:-hybrid}
      RAG_API_URL: ${RAG_API_URL:-http://rag-api:8000}
      RAG_GATEWAY_HMAC_SECRET: ${RAG_GATEWAY_HMAC_SECRET:-}
      RAG_TOOL_TIMEOUT_SECONDS: ${RAG_TOOL_TIMEOUT_SECONDS:-30}
      # Registry·runtime release 검증과 함께 명시적으로 활성화한 환경에서만 호출한다.
      RAG_FEATURE_ENABLED: ${RAG_FEATURE_ENABLED:-0}
      RAG_MANUALS_DIR: /workspace/data/rag/manuals
      REPORT_ASSISTANT_MAX_MODEL_ATTEMPTS: ${REPORT_ASSISTANT_MAX_MODEL_ATTEMPTS:-2}
      REPORT_ASSISTANT_MAX_INPUT_TOKENS: ${REPORT_ASSISTANT_MAX_INPUT_TOKENS:-16000}
      REPORT_ASSISTANT_MAX_OUTPUT_TOKENS: ${REPORT_ASSISTANT_MAX_OUTPUT_TOKENS:-4096}
      REPORT_ASSISTANT_MAX_ESTIMATED_COST_USD: ${REPORT_ASSISTANT_MAX_ESTIMATED_COST_USD:-}
      REPORT_ASSISTANT_PAGE_RENDER_TIMEOUT_SECONDS: ${REPORT_ASSISTANT_PAGE_RENDER_TIMEOUT_SECONDS:-15}
      REPORT_ASSISTANT_REQUESTS_PER_HOUR: ${REPORT_ASSISTANT_REQUESTS_PER_HOUR:-30}
      # 세 값이 모두 명시되지 않으면 Report Assistant는 외부 모델 호출 전에 닫힌다.
      REPORT_ASSISTANT_INPUT_USD_PER_MILLION: ${REPORT_ASSISTANT_INPUT_USD_PER_MILLION:-}
      REPORT_ASSISTANT_OUTPUT_USD_PER_MILLION: ${REPORT_ASSISTANT_OUTPUT_USD_PER_MILLION:-}
      REPORT_ASSISTANT_EXTERNAL_TRANSFER_PREAUTHORIZED: ${REPORT_ASSISTANT_EXTERNAL_TRANSFER_PREAUTHORIZED:-false}
      MCP_TOOL_RATE_LIMIT_QUOTA: ${MCP_TOOL_RATE_LIMIT_QUOTA:?MCP_TOOL_RATE_LIMIT_QUOTA is required}
      MCP_TOOL_RATE_LIMIT_WINDOW_SECONDS: ${MCP_TOOL_RATE_LIMIT_WINDOW_SECONDS:?MCP_TOOL_RATE_LIMIT_WINDOW_SECONDS is required}
      AUTH_PRINCIPALS_FILE: /run/secrets/answervice_auth_principals.json
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET is required}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-86400}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://127.0.0.1:13000,http://localhost:13000,http://localhost:5173}
      TZ: Asia/Seoul
      SKIP_MIGRATIONS: "1"
    volumes:
      # Authentication material is an external deployment secret. There is no
      # repository-local principal fallback because stale hashes and subjects
      # must never become valid merely by checking out the project.
      - ${AUTH_PRINCIPALS_HOST_FILE:?AUTH_PRINCIPALS_HOST_FILE is required}:/run/secrets/answervice_auth_principals.json:ro
      - ${TRINO_TLS_CA_HOST_FILE:?TRINO_TLS_CA_HOST_FILE is required}:/run/secrets/trino-ca.pem:ro
      - ${DATAHUB_TLS_CA_HOST_FILE:?DATAHUB_TLS_CA_HOST_FILE is required}:/run/secrets/datahub-ca.pem:ro
      - ${RAG_MANUALS_HOST_DIR:-../../data/rag/manuals}:/workspace/data/rag/manuals:ro
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:18000:8000"
    networks:
      - database-network
      - datahub-network
    depends_on:
      app-postgres:
        condition: service_healthy
      app-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
