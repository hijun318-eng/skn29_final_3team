services:
  frontend:
    profiles: [dev, full, split-host]
    container_name: answervice-frontend
    build:
      context: ../../app/enterprise-react
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_BASE_URL: "${VITE_BACKEND_BASE_URL:?VITE_BACKEND_BASE_URL is required}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:13000:8080"
    networks:
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q healthy"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 6
    restart: unless-stopped
