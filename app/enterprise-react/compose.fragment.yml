services:
  frontend:
    container_name: answervice-frontend
    build:
      context: ../../app/enterprise-react
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:13000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q healthy"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 6
    restart: unless-stopped
