services:
  frontend:
    profiles: [dev, full, split-host]
    container_name: answervice-frontend
    build:
      context: ../../app/frontend
      dockerfile: Dockerfile
      args:
        # 브라우저에는 same-origin 경로만 노출하고 Compose 서비스명은 Nginx가 소유한다.
        VITE_BACKEND_BASE_URL: "${VITE_BACKEND_BASE_URL:-/api}"
        ANSWERVICE_SOURCE_REVISION: ${ANSWERVICE_SOURCE_REVISION:-}
        ANSWERVICE_SOURCE_DIRTY: ${ANSWERVICE_SOURCE_DIRTY:-}
        ANSWERVICE_SOURCE_FINGERPRINT: ${ANSWERVICE_SOURCE_FINGERPRINT:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:13000:8080"
    networks:
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q healthy"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 6
    restart: unless-stopped
