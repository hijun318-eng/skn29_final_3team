name: answervice-service-demo-v3
services:
  pms-postgres:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_DB: pms_db
      POSTGRES_USER: ${V3_PMS_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${PMS_ADMIN_PASSWORD:?set PMS_ADMIN_PASSWORD}
      SOURCE_READONLY_USER: ${PMS_READONLY_USER:?set PMS_READONLY_USER}
      SOURCE_READONLY_PASSWORD: ${PMS_READONLY_PASSWORD:?set PMS_READONLY_PASSWORD}
      SOURCE_READONLY_ROLE: pms_readonly
      TZ: Asia/Seoul
    volumes:
      - pms-service-demo-v3-data:/var/lib/postgresql/data
      - ../../../../infrastructure/database/sql/ddl/01_hotel_pms_postgresql.sql:/docker-entrypoint-initdb.d/00-ddl.sql:ro
      - ./01_pms_seed_service_demo_v3.sql:/docker-entrypoint-initdb.d/10-synthetic.sql:ro
      - ../../../../infrastructure/database/security:/security:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
  pos-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pos_db
      MYSQL_ROOT_PASSWORD: ${POS_ROOT_PASSWORD:?set POS_ROOT_PASSWORD}
      POS_READONLY_USER: ${POS_READONLY_USER:?set POS_READONLY_USER}
      POS_READONLY_PASSWORD: ${POS_READONLY_PASSWORD:?set POS_READONLY_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - pos-service-demo-v3-data:/var/lib/mysql
      - ../../../../infrastructure/database/sql/ddl/02_hotel_pos_mysql.sql:/docker-entrypoint-initdb.d/00-ddl.sql:ro
      - ./02_pos_seed_service_demo_v3.sql:/docker-entrypoint-initdb.d/10-synthetic.sql:ro
      - ../../../../infrastructure/database/security:/security:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
  crm-mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU17-ubuntu-22.04
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${CRM_SA_PASSWORD:?set CRM_SA_PASSWORD}
      CRM_READONLY_USER: ${CRM_READONLY_USER:?set CRM_READONLY_USER}
      CRM_READONLY_PASSWORD: ${CRM_READONLY_PASSWORD:?set CRM_READONLY_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - crm-service-demo-v3-data:/var/opt/mssql
      - ../../../../infrastructure/database/mssql/entrypoint.sh:/bootstrap/entrypoint.sh:ro
      - ../../../../infrastructure/database/sql/ddl/03_hotel_crm_sqlserver.sql:/bootstrap/00-ddl.sql:ro
      - ./03_crm_seed_service_demo_v3.sql:/bootstrap/10-synthetic.sql:ro
      - ../../../../infrastructure/database/security:/security:ro
    entrypoint: ["/bin/bash", "/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
  banquet-postgres:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_DB: banquet_db
      POSTGRES_USER: ${V3_BANQUET_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${PMS_ADMIN_PASSWORD:?set PMS_ADMIN_PASSWORD}
      SOURCE_READONLY_USER: ${BANQUET_READONLY_USER:?set BANQUET_READONLY_USER}
      SOURCE_READONLY_PASSWORD: ${BANQUET_READONLY_PASSWORD:?set BANQUET_READONLY_PASSWORD}
      SOURCE_READONLY_ROLE: banquet_readonly
      TZ: Asia/Seoul
    volumes:
      - banquet-service-demo-v3-data:/var/lib/postgresql/data
      - ../../../../infrastructure/database/sql/ddl/05_hotel_banquet_postgresql.sql:/docker-entrypoint-initdb.d/00-ddl.sql:ro
      - ./04_banquet_seed_service_demo_v3.sql:/docker-entrypoint-initdb.d/10-synthetic.sql:ro
      - ../../../../infrastructure/database/security:/security:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
  facility-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: facility
      CLICKHOUSE_USER: ${FACILITY_ADMIN_USER:?set FACILITY_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${FACILITY_ADMIN_PASSWORD:?set FACILITY_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      FACILITY_READONLY_USER: ${FACILITY_READONLY_USER:?set FACILITY_READONLY_USER}
      FACILITY_READONLY_PASSWORD: ${FACILITY_READONLY_PASSWORD:?set FACILITY_READONLY_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - facility-service-demo-v3-data:/var/lib/clickhouse
      - ../../../../infrastructure/database/sql/ddl/04_hotel_facility_clickhouse.sql:/docker-entrypoint-initdb.d/00-ddl.sql:ro
      - ./05_facility_seed_service_demo_v3.sql:/docker-entrypoint-initdb.d/10-synthetic.sql:ro
      - ../../../../infrastructure/database/security:/security:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query \"SELECT 1\" >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  trino:
    image: trinodb/trino:476
    environment:
      PMS_READONLY_USER: ${PMS_READONLY_USER:?set PMS_READONLY_USER}
      PMS_READONLY_PASSWORD: ${PMS_READONLY_PASSWORD:?set PMS_READONLY_PASSWORD}
      BANQUET_READONLY_USER: ${BANQUET_READONLY_USER:?set BANQUET_READONLY_USER}
      BANQUET_READONLY_PASSWORD: ${BANQUET_READONLY_PASSWORD:?set BANQUET_READONLY_PASSWORD}
      POS_READONLY_USER: ${POS_READONLY_USER:?set POS_READONLY_USER}
      POS_READONLY_PASSWORD: ${POS_READONLY_PASSWORD:?set POS_READONLY_PASSWORD}
      CRM_READONLY_USER: ${CRM_READONLY_USER:?set CRM_READONLY_USER}
      CRM_READONLY_PASSWORD: ${CRM_READONLY_PASSWORD:?set CRM_READONLY_PASSWORD}
      FACILITY_READONLY_USER: ${FACILITY_READONLY_USER:?set FACILITY_READONLY_USER}
      FACILITY_READONLY_PASSWORD: ${FACILITY_READONLY_PASSWORD:?set FACILITY_READONLY_PASSWORD}
    depends_on:
      pms-postgres: {condition: service_healthy}
      pos-mysql: {condition: service_healthy}
      crm-mssql: {condition: service_healthy}
      banquet-postgres: {condition: service_healthy}
      facility-clickhouse: {condition: service_healthy}
    volumes:
      - ../../../../infrastructure/database/trino/etc:/etc/trino:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  pms-service-demo-v3-data: {}
  pos-service-demo-v3-data: {}
  crm-service-demo-v3-data: {}
  banquet-service-demo-v3-data: {}
  facility-service-demo-v3-data: {}
