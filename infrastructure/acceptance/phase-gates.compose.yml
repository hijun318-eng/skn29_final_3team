name: answervice-phase-gates

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --auth-host=trust --auth-local=trust
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      io.answervice.scope: phase-gates
      io.answervice.owner: codex-isolated-acceptance
    volumes:
      - phase_gate_postgres_data:/var/lib/postgresql/data

volumes:
  phase_gate_postgres_data:
    labels:
      io.answervice.scope: phase-gates
      io.answervice.owner: codex-isolated-acceptance
