# Phase 4 RuntimeCatalogProjection acceptance DB.
# Always invoke with `docker compose -p answervice-phase2b-datahub`.
services:
  phase4-app-db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: answervice-phase2b-datahub-phase4-app-db
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --auth-host=trust --auth-local=trust
    ports:
      - "127.0.0.1:55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      io.answervice.scope: phase4-runtime-catalog
      io.answervice.owner: codex-isolated-acceptance
    networks:
      - datahub-network
    volumes:
      - phase4_app_postgres_data:/var/lib/postgresql/data

networks:
  datahub-network:
    external: true
    name: answervice-phase2b-datahub_datahub-network

volumes:
  phase4_app_postgres_data:
    name: answervice-phase2b-datahub_phase4-app-postgres-data
    labels:
      io.answervice.scope: phase4-runtime-catalog
      io.answervice.owner: codex-isolated-acceptance
