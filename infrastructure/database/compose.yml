name: answervice-database

services:
  app-postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?set APP_DB_NAME in .env}
      POSTGRES_USER: ${APP_DB_ADMIN_USER:?set APP_DB_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${APP_DB_ADMIN_PASSWORD:?set APP_DB_ADMIN_PASSWORD in .env}
      TZ: Asia/Seoul
      APP_RW_USERNAME: ${APP_RW_USERNAME:?set APP_RW_USERNAME in .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set APP_RW_PASSWORD in .env}
      APP_MIGRATION_USERNAME: ${APP_MIGRATION_USERNAME:?set APP_MIGRATION_USERNAME in .env}
      APP_MIGRATION_PASSWORD: ${APP_MIGRATION_PASSWORD:?set APP_MIGRATION_PASSWORD in .env}
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./init/app-postgres:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${APP_POSTGRES_PORT:-54321}:5432"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pms-postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: ${PMS_DB_NAME:?set PMS_DB_NAME in .env}
      POSTGRES_USER: ${PMS_DB_ADMIN_USER:?set PMS_DB_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${PMS_DB_ADMIN_PASSWORD:?set PMS_DB_ADMIN_PASSWORD in .env}
      PMS_RO_USERNAME: ${PMS_RO_USERNAME:?set PMS_RO_USERNAME in .env}
      PMS_RO_PASSWORD: ${PMS_RO_PASSWORD:?set PMS_RO_PASSWORD in .env}
      TZ: Asia/Seoul
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
      - ./init/pms-postgres:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${PMS_POSTGRES_PORT:-54322}:5432"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  banquet-postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: ${BANQUET_DB_NAME:?set BANQUET_DB_NAME in .env}
      POSTGRES_USER: ${BANQUET_DB_ADMIN_USER:?set BANQUET_DB_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${BANQUET_DB_ADMIN_PASSWORD:?set BANQUET_DB_ADMIN_PASSWORD in .env}
      BANQUET_RO_USERNAME: ${BANQUET_RO_USERNAME:?set BANQUET_RO_USERNAME in .env}
      BANQUET_RO_PASSWORD: ${BANQUET_RO_PASSWORD:?set BANQUET_RO_PASSWORD in .env}
      TZ: Asia/Seoul
    volumes:
      - banquet-postgres-data:/var/lib/postgresql/data
      - ./init/banquet-postgres:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${BANQUET_POSTGRES_PORT:-54323}:5432"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pos-mysql:
    image: mysql:8.4.2
    environment:
      MYSQL_DATABASE: ${POS_DB_NAME:?set POS_DB_NAME in .env}
      MYSQL_ROOT_PASSWORD: ${POS_DB_ROOT_PASSWORD:?set POS_DB_ROOT_PASSWORD in .env}
      POS_RO_USERNAME: ${POS_RO_USERNAME:?set POS_RO_USERNAME in .env}
      POS_RO_PASSWORD: ${POS_RO_PASSWORD:?set POS_RO_PASSWORD in .env}
      TZ: Asia/Seoul
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - pos-mysql-data:/var/lib/mysql
      - ./init/pos-mysql:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${POS_MYSQL_PORT:-33061}:3306"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  crm-mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${CRM_SA_PASSWORD:?set CRM_SA_PASSWORD in .env}
      MSSQL_PID: Developer
      TZ: Asia/Seoul
    volumes:
      - crm-mssql-data:/var/opt/mssql
    ports: ["127.0.0.1:${CRM_MSSQL_PORT:-14331}:1433"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  crm-mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      CRM_SA_PASSWORD: ${CRM_SA_PASSWORD:?set CRM_SA_PASSWORD in .env}
      CRM_DB_NAME: ${CRM_DB_NAME:?set CRM_DB_NAME in .env}
      CRM_RO_USERNAME: ${CRM_RO_USERNAME:?set CRM_RO_USERNAME in .env}
      CRM_RO_PASSWORD: ${CRM_RO_PASSWORD:?set CRM_RO_PASSWORD in .env}
    volumes:
      - ./init/crm-mssql:/init:ro
    networks: [database]
    depends_on:
      crm-mssql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/00-bootstrap.sh"]
    restart: "no"

  facility-clickhouse:
    image: clickhouse/clickhouse-server:24.8.4.13-alpine
    environment:
      CLICKHOUSE_DB: ${FACILITY_DB_NAME:?set FACILITY_DB_NAME in .env}
      CLICKHOUSE_USER: ${FACILITY_ADMIN_USERNAME:?set FACILITY_ADMIN_USERNAME in .env}
      CLICKHOUSE_PASSWORD: ${FACILITY_ADMIN_PASSWORD:?set FACILITY_ADMIN_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      FACILITY_RO_USERNAME: ${FACILITY_RO_USERNAME:?set FACILITY_RO_USERNAME in .env}
      FACILITY_RO_PASSWORD: ${FACILITY_RO_PASSWORD:?set FACILITY_RO_PASSWORD in .env}
      TZ: Asia/Seoul
    volumes:
      - facility-clickhouse-data:/var/lib/clickhouse
      - ./init/facility-clickhouse:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${FACILITY_CLICKHOUSE_PORT:-8124}:8123"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

networks:
  database:
    name: answervice-database

volumes:
  app-postgres-data:
  pms-postgres-data:
  banquet-postgres-data:
  pos-mysql-data:
  crm-mssql-data:
  facility-clickhouse-data:
