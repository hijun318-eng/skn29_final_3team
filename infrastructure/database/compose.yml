name: ${COMPOSE_PROJECT_NAME:-hotel-synthetic-db}

services:
  app-postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_ADMIN_USER}
      POSTGRES_PASSWORD: ${APP_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --data-checksums --auth-host=scram-sha-256
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_MIGRATION_USER: ${APP_MIGRATION_USER}
      APP_MIGRATION_PASSWORD: ${APP_MIGRATION_PASSWORD}
    command:
      - postgres
      - -c
      - timezone=Asia/Seoul
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:${APP_POSTGRES_PORT:-15432}:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./init/app-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    shm_size: 256mb
    stop_grace_period: 30s
    networks:
      - database-network

  pms-postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      POSTGRES_DB: ${PMS_DB_NAME}
      POSTGRES_USER: ${PMS_ADMIN_USER}
      POSTGRES_PASSWORD: ${PMS_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --data-checksums --auth-host=scram-sha-256
      PMS_READONLY_USER: ${PMS_READONLY_USER}
      PMS_READONLY_PASSWORD: ${PMS_READONLY_PASSWORD}
    command:
      - postgres
      - -c
      - timezone=Asia/Seoul
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:${PMS_POSTGRES_PORT:-15433}:5432"
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
      - ./init/pms-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    shm_size: 256mb
    stop_grace_period: 30s
    networks:
      - database-network

  banquet-postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      POSTGRES_DB: ${BANQUET_DB_NAME}
      POSTGRES_USER: ${BANQUET_ADMIN_USER}
      POSTGRES_PASSWORD: ${BANQUET_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --data-checksums --auth-host=scram-sha-256
      BANQUET_READONLY_USER: ${BANQUET_READONLY_USER}
      BANQUET_READONLY_PASSWORD: ${BANQUET_READONLY_PASSWORD}
    command:
      - postgres
      - -c
      - timezone=Asia/Seoul
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:${BANQUET_POSTGRES_PORT:-15434}:5432"
    volumes:
      - banquet-postgres-data:/var/lib/postgresql/data
      - ./init/banquet-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    shm_size: 256mb
    stop_grace_period: 30s
    networks:
      - database-network

  pos-mysql:
    image: ${MYSQL_IMAGE}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: ${POS_DB_NAME}
      POS_DB_NAME: ${POS_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${POS_ROOT_PASSWORD}
      POS_READONLY_USER: ${POS_READONLY_USER}
      POS_READONLY_PASSWORD: ${POS_READONLY_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "127.0.0.1:${POS_MYSQL_PORT:-13306}:3306"
    volumes:
      - pos-mysql-data:/var/lib/mysql
      - ./init/pos-mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 45s
    networks:
      - database-network

  crm-mssql:
    image: ${MSSQL_IMAGE}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA}
      MSSQL_PID: ${MSSQL_PID}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      CRM_DB_NAME: ${CRM_DB_NAME}
      CRM_READONLY_USER: ${CRM_READONLY_USER}
      CRM_READONLY_PASSWORD: ${CRM_READONLY_PASSWORD}
    entrypoint: ["/bin/bash", "/init/00-entrypoint.sh"]
    ports:
      - "127.0.0.1:${CRM_MSSQL_PORT:-11433}:1433"
    volumes:
      - crm-mssql-data:/var/opt/mssql
      - ./init/crm-mssql:/init:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
          [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd;
          "$$SQLCMD" -S 127.0.0.1 -U sa -P "$$MSSQL_SA_PASSWORD" -C
          -d "$$CRM_DB_NAME" -b -l 5
          -Q "SET NOCOUNT ON; IF OBJECT_ID(N'crm.schema_version', N'U') IS NULL THROW 50000, 'initialization incomplete', 1; SELECT 1;"
          -o /dev/null
      interval: 10s
      timeout: 8s
      retries: 40
      start_period: 45s
    shm_size: 1gb
    stop_grace_period: 60s
    networks:
      - database-network

  facility-clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      CLICKHOUSE_DB: ${FACILITY_DB_NAME}
      CLICKHOUSE_USER: ${FACILITY_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${FACILITY_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      FACILITY_READONLY_USER: ${FACILITY_READONLY_USER}
      FACILITY_READONLY_PASSWORD: ${FACILITY_READONLY_PASSWORD}
    ports:
      - "127.0.0.1:${FACILITY_CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${FACILITY_CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - facility-clickhouse-data:/var/lib/clickhouse
      - facility-clickhouse-logs:/var/log/clickhouse-server
      - ./init/facility-clickhouse:/docker-entrypoint-initdb.d:ro
      - ./init/facility-clickhouse/config/timezone.xml:/etc/clickhouse-server/config.d/timezone.xml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --host 127.0.0.1
          --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    stop_grace_period: 30s
    networks:
      - database-network

volumes:
  app-postgres-data:
  pms-postgres-data:
  banquet-postgres-data:
  pos-mysql-data:
  crm-mssql-data:
  facility-clickhouse-data:
  facility-clickhouse-logs:

networks:
  database-network:
    driver: bridge
