# 책임: 저장소에는 schema만 bootstrap하고 각 엔진의 runtime 자격증명은 외부
# 환경에서 주입한다. healthcheck나 필수 secret 실패는 downstream 시작을 차단한다.
name: ${COMPOSE_PROJECT_NAME:-answervice}

x-db: &db
  restart: unless-stopped
  networks: [database-network]

services:
  app-postgres:
    <<: *db
    profiles: [dev, full, split-host]
    container_name: app-postgres
    image: "postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60"
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-app_db}
      POSTGRES_USER: ${APP_ADMIN_USER}
      POSTGRES_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_MIGRATION_USER: ${APP_MIGRATION_USER}
      APP_MIGRATION_PASSWORD: ${APP_MIGRATION_PASSWORD}
      APP_CATALOG_PUBLISHER_USER: ${APP_CATALOG_PUBLISHER_USER}
      APP_CATALOG_PUBLISHER_PASSWORD: ${APP_CATALOG_PUBLISHER_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./sql/ddl/00_answervice_app_postgresql.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./security:/security:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pms-postgres:
    <<: *db
    profiles: [full, split-host]
    container_name: pms-postgres
    image: "postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60"
    environment:
      POSTGRES_DB: ${PMS_DB_NAME:-pms_db}
      POSTGRES_USER: ${PMS_ADMIN_USER}
      POSTGRES_PASSWORD: ${PMS_ADMIN_PASSWORD}
      SOURCE_READONLY_USER: ${PMS_READONLY_USER}
      SOURCE_READONLY_PASSWORD: ${PMS_READONLY_PASSWORD}
      SOURCE_READONLY_ROLE: pms_readonly
      PMS_READONLY_USER: ${PMS_READONLY_USER}
      PMS_READONLY_PASSWORD: ${PMS_READONLY_PASSWORD}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
      - ./sql/ddl/01_hotel_pms_postgresql.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./security:/security:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  banquet-postgres:
    <<: *db
    profiles: [full, split-host]
    container_name: banquet-postgres
    image: "postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60"
    environment:
      POSTGRES_DB: ${BANQUET_DB_NAME:-banquet_db}
      POSTGRES_USER: ${BANQUET_ADMIN_USER}
      POSTGRES_PASSWORD: ${BANQUET_ADMIN_PASSWORD}
      SOURCE_READONLY_USER: ${BANQUET_READONLY_USER}
      SOURCE_READONLY_PASSWORD: ${BANQUET_READONLY_PASSWORD}
      SOURCE_READONLY_ROLE: banquet_readonly
      BANQUET_READONLY_USER: ${BANQUET_READONLY_USER}
      BANQUET_READONLY_PASSWORD: ${BANQUET_READONLY_PASSWORD}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    ports: ["127.0.0.1:15434:5432"]
    volumes:
      - banquet-postgres-data:/var/lib/postgresql/data
      - ./sql/ddl/05_hotel_banquet_postgresql.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./security:/security:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pos-mysql:
    <<: *db
    profiles: [full, split-host]
    container_name: pos-mysql
    image: "mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9"
    environment:
      MYSQL_DATABASE: ${POS_DB_NAME:-pos_db}
      MYSQL_ROOT_PASSWORD: ${POS_ROOT_PASSWORD}
      POS_READONLY_USER: ${POS_READONLY_USER}
      POS_READONLY_PASSWORD: ${POS_READONLY_PASSWORD}
      TZ: Asia/Seoul
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - pos-mysql-data:/var/lib/mysql
      - ./sql/ddl/02_hotel_pos_mysql.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./security:/security:ro
    healthcheck:
      # Password is inherited through the child environment, never expanded into
      # the healthcheck process argv or persisted in Docker inspection output.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 1800s

  crm-mssql:
    <<: *db
    profiles: [full, split-host]
    container_name: crm-mssql
    image: "mcr.microsoft.com/mssql/server:2022-CU17-ubuntu-22.04@sha256:d252932ef839c24c61c1139cc98f69c85ca774fa7c6bfaaa0015b7eb02b9dc87"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${CRM_SA_PASSWORD}
      CRM_READONLY_USER: ${CRM_READONLY_USER}
      CRM_READONLY_PASSWORD: ${CRM_READONLY_PASSWORD}
      TZ: Asia/Seoul
    entrypoint: ["/bin/bash", "/bootstrap/entrypoint.sh"]
    ports: ["127.0.0.1:11433:1433"]
    volumes:
      - crm-mssql-data:/var/opt/mssql
      - ./mssql/entrypoint.sh:/bootstrap/entrypoint.sh:ro
      - ./sql/ddl/03_hotel_crm_sqlserver.sql:/bootstrap/00-ddl.sql:ro
      - ./security:/security:ro
    healthcheck:
      # sqlcmd reads SQLCMDPASSWORD from its environment so the secret never
      # becomes a `-P` process argument visible inside the container.
      test: ["CMD-SHELL", "test -f /var/opt/mssql/.answervice_schema_initialized && SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  facility-clickhouse:
    <<: *db
    profiles: [full, split-host]
    container_name: facility-clickhouse
    image: "clickhouse/clickhouse-server:24.8.4.13@sha256:b2c51583a6df9c19d613b579a03f237b92e0dfc63433b3fdb567ce223e0fb0f7"
    environment:
      CLICKHOUSE_DB: ${FACILITY_DB_NAME:-facility}
      CLICKHOUSE_USER: ${FACILITY_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${FACILITY_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      FACILITY_READONLY_USER: ${FACILITY_READONLY_USER}
      FACILITY_READONLY_PASSWORD: ${FACILITY_READONLY_PASSWORD}
      TZ: Asia/Seoul
    ports: ["127.0.0.1:18123:8123", "127.0.0.1:19000:9000"]
    volumes:
      - facility-clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/timezone.xml:/etc/clickhouse-server/config.d/timezone.xml:ro
      - ./sql/ddl/04_hotel_facility_clickhouse.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./security:/security:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  serving-catalog-postgres:
    <<: *db
    profiles: [full, split-host]
    container_name: serving-catalog-postgres
    image: "postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60"
    environment:
      POSTGRES_DB: ${SERVING_CATALOG_DB_NAME:-serving_catalog}
      POSTGRES_USER: ${SERVING_CATALOG_DB_USER:?SERVING_CATALOG_DB_USER is required}
      POSTGRES_PASSWORD: ${SERVING_CATALOG_DB_PASSWORD:?SERVING_CATALOG_DB_PASSWORD is required}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - serving-catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  serving-object-store:
    <<: *db
    profiles: [full, split-host]
    container_name: serving-object-store
    image: "rustfs/rustfs:1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3"
    environment:
      RUSTFS_ACCESS_KEY: ${SERVING_OBJECT_STORE_ACCESS_KEY:?SERVING_OBJECT_STORE_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${SERVING_OBJECT_STORE_SECRET_KEY:?SERVING_OBJECT_STORE_SECRET_KEY is required}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - serving-object-store-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  serving-object-store-bootstrap:
    profiles: [full, split-host]
    restart: "no"
    image: "amazon/aws-cli:2.35.21@sha256:238583846e731f31c9848dae26c5a560769ff35c4c5368a4cb6be5816683e485"
    networks: [database-network]
    depends_on:
      serving-object-store: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${SERVING_OBJECT_STORE_ACCESS_KEY:?SERVING_OBJECT_STORE_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${SERVING_OBJECT_STORE_SECRET_KEY:?SERVING_OBJECT_STORE_SECRET_KEY is required}
      AWS_DEFAULT_REGION: ${SERVING_OBJECT_STORE_REGION:-ap-northeast-2}
      SERVING_OBJECT_STORE_BUCKET: ${SERVING_OBJECT_STORE_BUCKET:-answervice-serving}
    entrypoint: "/bin/sh"
    command:
      - -ec
      - |
        if aws --endpoint-url http://serving-object-store:9000 s3api head-bucket \
          --bucket "$$SERVING_OBJECT_STORE_BUCKET" >/dev/null 2>&1; then
          exit 0
        fi
        aws --endpoint-url http://serving-object-store:9000 s3api create-bucket \
          --bucket "$$SERVING_OBJECT_STORE_BUCKET"

  serving-catalog-bootstrap:
    profiles: [full, split-host]
    restart: "no"
    image: "apache/polaris-admin-tool:1.7.0@sha256:3d8a24cea57aef3b71a0d7b09e5d2278d01e7e1b30071bf6648f2a6953322cca"
    networks: [database-network]
    depends_on:
      serving-catalog-postgres: { condition: service_healthy }
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://serving-catalog-postgres:5432/${SERVING_CATALOG_DB_NAME:-serving_catalog}
      QUARKUS_DATASOURCE_USERNAME: ${SERVING_CATALOG_DB_USER:?SERVING_CATALOG_DB_USER is required}
      QUARKUS_DATASOURCE_PASSWORD: ${SERVING_CATALOG_DB_PASSWORD:?SERVING_CATALOG_DB_PASSWORD is required}
    volumes:
      - ${SERVING_CATALOG_BOOTSTRAP_CREDENTIALS_HOST_FILE:?SERVING_CATALOG_BOOTSTRAP_CREDENTIALS_HOST_FILE is required}:/run/secrets/serving-catalog-bootstrap.credentials:ro
    command:
      - bootstrap
      - --credentials-file=/run/secrets/serving-catalog-bootstrap.credentials

  serving-catalog:
    <<: *db
    profiles: [full, split-host]
    container_name: serving-catalog
    image: "apache/polaris:1.7.0@sha256:3495f67f38cca33892a045f7dd3f46eb52387f0fd52d4145538a772fd8aedad7"
    depends_on:
      serving-catalog-bootstrap: { condition: service_completed_successfully }
      serving-object-store-bootstrap: { condition: service_completed_successfully }
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "5"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "100"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "5000"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://serving-catalog-postgres:5432/${SERVING_CATALOG_DB_NAME:-serving_catalog}
      QUARKUS_DATASOURCE_USERNAME: ${SERVING_CATALOG_DB_USER:?SERVING_CATALOG_DB_USER is required}
      QUARKUS_DATASOURCE_PASSWORD: ${SERVING_CATALOG_DB_PASSWORD:?SERVING_CATALOG_DB_PASSWORD is required}
      POLARIS_REALM_CONTEXT_REALMS: ANSWERVICE
      polaris.realm-context.require-header: "true"
      QUARKUS_OTEL_SDK_DISABLED: "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
      polaris.authentication.token-broker.type: rsa-key-pair
      polaris.authentication.token-broker.rsa-key-pair.public-key-file: /run/secrets/serving-catalog-token-public.pem
      polaris.authentication.token-broker.rsa-key-pair.private-key-file: /run/secrets/serving-catalog-token-private.pem
      AWS_REGION: ${SERVING_OBJECT_STORE_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${SERVING_OBJECT_STORE_ACCESS_KEY:?SERVING_OBJECT_STORE_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${SERVING_OBJECT_STORE_SECRET_KEY:?SERVING_OBJECT_STORE_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${SERVING_CATALOG_API_PORT:-18181}:8181"
    volumes:
      - ${SERVING_CATALOG_TOKEN_PUBLIC_KEY_HOST_FILE:?SERVING_CATALOG_TOKEN_PUBLIC_KEY_HOST_FILE is required}:/run/secrets/serving-catalog-token-public.pem:ro
      - ${SERVING_CATALOG_TOKEN_PRIVATE_KEY_HOST_FILE:?SERVING_CATALOG_TOKEN_PRIVATE_KEY_HOST_FILE is required}:/run/secrets/serving-catalog-token-private.pem:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  trino:
    <<: *db
    profiles: [full, split-host]
    image: "trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534"
    environment:
      PMS_READONLY_USER: ${PMS_READONLY_USER}
      PMS_READONLY_PASSWORD: ${PMS_READONLY_PASSWORD}
      BANQUET_READONLY_USER: ${BANQUET_READONLY_USER}
      BANQUET_READONLY_PASSWORD: ${BANQUET_READONLY_PASSWORD}
      POS_READONLY_USER: ${POS_READONLY_USER}
      POS_READONLY_PASSWORD: ${POS_READONLY_PASSWORD}
      CRM_READONLY_USER: ${CRM_READONLY_USER}
      CRM_READONLY_PASSWORD: ${CRM_READONLY_PASSWORD}
      FACILITY_READONLY_USER: ${FACILITY_READONLY_USER}
      FACILITY_READONLY_PASSWORD: ${FACILITY_READONLY_PASSWORD}
      TRINO_TLS_KEYSTORE_PASSWORD: ${TRINO_TLS_KEYSTORE_PASSWORD:?TRINO_TLS_KEYSTORE_PASSWORD is required}
      TRINO_INTERNAL_SHARED_SECRET: ${TRINO_INTERNAL_SHARED_SECRET:?TRINO_INTERNAL_SHARED_SECRET is required}
      SERVING_CATALOG_CLIENT_ID: ${SERVING_CATALOG_TRINO_CLIENT_ID:?SERVING_CATALOG_TRINO_CLIENT_ID is required}
      SERVING_CATALOG_CLIENT_SECRET: ${SERVING_CATALOG_TRINO_CLIENT_SECRET:?SERVING_CATALOG_TRINO_CLIENT_SECRET is required}
    depends_on:
      pms-postgres: { condition: service_healthy }
      banquet-postgres: { condition: service_healthy }
      pos-mysql: { condition: service_healthy }
      crm-mssql: { condition: service_healthy }
      facility-clickhouse: { condition: service_healthy }
      serving-catalog: { condition: service_healthy }
    ports: ["127.0.0.1:${TRINO_PORT:-18443}:8443"]
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ./sql/ddl:/sql/ddl:ro
      # Auth hashes, server key material, and the public CA are deployment
      # inputs. Missing files must fail as bind mounts, never become directories.
      - ${TRINO_PASSWORD_DB_HOST_FILE:?TRINO_PASSWORD_DB_HOST_FILE is required}:/run/secrets/trino-password.db:ro
      - ${TRINO_TLS_KEYSTORE_HOST_FILE:?TRINO_TLS_KEYSTORE_HOST_FILE is required}:/run/secrets/trino-keystore.p12:ro
      - ${TRINO_TLS_CA_HOST_FILE:?TRINO_TLS_CA_HOST_FILE is required}:/run/secrets/trino-ca.pem:ro
    healthcheck:
      # /v1/info is intentionally public in Trino; this checks the TLS server
      # and CA binding only. start.ps1 separately proves authenticated SQL.
      test: ["CMD-SHELL", "curl --fail --silent --show-error --cacert /run/secrets/trino-ca.pem https://trino:8443/v1/info >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

networks:
  database-network:
    name: ${COMPOSE_PROJECT_NAME:-answervice}-network

volumes:
  app-postgres-data: {}
  # Compose-scoped names prevent a new environment from silently attaching to
  # an old scenario volume whose provenance cannot be verified.
  pms-postgres-data: {}
  banquet-postgres-data: {}
  pos-mysql-data: {}
  crm-mssql-data: {}
  facility-clickhouse-data: {}
  serving-catalog-postgres-data: {}
  serving-object-store-data: {}
