# 책임: DataHub control-plane 구성요소를 검증된 image digest로 고정한다. metadata
# backend가 준비되지 않으면 consumer/GMS/UI dependency chain을 진행하지 않는다.
x-datahub-source:
  release: v1.7.0
  revision: 7f81ccbfe27b9acc947f5f600fcf9ddb72138a80
  compose_blob: 39b0f37f089302209ce8d7e932eeb7c50caa28d9
  sha256: ec476d12f6f278c50d657a617357a050510565ef00b570a69cbe9123a932a7b7
  url: https://raw.githubusercontent.com/datahub-project/datahub/7f81ccbfe27b9acc947f5f600fcf9ddb72138a80/docker/quickstart/docker-compose.quickstart-profile.yml

x-datahub-service: &datahub-service
  profiles: [full, split-host]
  restart: unless-stopped
  networks: [datahub-network]

services:
  kafka-broker:
    <<: *datahub-service
    # Exact manifest digests keep the upstream quickstart topology reproducible;
    # version tags remain as human-readable compatibility labels.
    image: confluentinc/cp-kafka:8.2.2@sha256:8e01c0305844d6c05bfb8e86479f5f363bb6a53497625395943a9da780de67ce
    hostname: broker
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093
      KAFKA_NODE_ID: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_PROCESS_ROLES: broker,controller
    volumes:
      - datahub-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server broker:29092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    <<: *datahub-service
    image: mysql:8.2@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_PASSWORD: ${DATAHUB_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATAHUB_MYSQL_ROOT_PASSWORD}
      MYSQL_USER: datahub
    volumes:
      - datahub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h mysql -u datahub"]
      interval: 5s
      timeout: 10s
      retries: 20

  opensearch:
    <<: *datahub-service
    image: opensearchproject/opensearch:2.19.3@sha256:e96cc6ae1500a073d973c0906f30f7cf4d9c461f32f855f9242a2da933660cdd
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: single-node
    volumes:
      - datahub-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://opensearch:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      interval: 5s
      timeout: 15s
      retries: 20

  system-update-quickstart:
    <<: *datahub-service
    restart: "no"
    image: acryldata/datahub-upgrade:v1.7.0@sha256:21e77ad964be64b2b5a7f74c9685897ed79e8854995242eaa5e5c426395b88c0
    command: ["-u", "SystemUpdate"]
    depends_on:
      kafka-broker: {condition: service_healthy}
      mysql: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      # SystemUpdate는 GMS의 TLS schema registry와 인증된 policy API를 호출한다.
      # 따라서 GMS 기동 전 실행하면 DNS/HTTPS 실패를 정상 완료로 오인할 수 없다.
      datahub-gms-quickstart: {condition: service_healthy}
    environment:
      DATAHUB_VERSION: v1.7.0
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8443"
      DATAHUB_GMS_USE_SSL: "true"
      DATAHUB_GMS_SSL_TRUSTSTORE_PATH: /run/secrets/datahub-truststore.p12
      DATAHUB_GMS_SSL_TRUSTSTORE_PASSWORD: ${DATAHUB_TLS_TRUSTSTORE_PASSWORD:?DATAHUB_TLS_TRUSTSTORE_PASSWORD is required}
      DATAHUB_GMS_SSL_TRUSTSTORE_TYPE: PKCS12
      DATAHUB_PRECREATE_TOPICS: "true"
      DATAHUB_SQL_SETUP_ENABLED: "true"
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT}
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY}
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      EBEAN_DATASOURCE_HOST: mysql:3306
      EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_MYSQL_PASSWORD}
      EBEAN_DATASOURCE_URL: jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2
      EBEAN_DATASOURCE_USERNAME: datahub
      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      GRAPH_SERVICE_IMPL: elasticsearch
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      KAFKA_SCHEMAREGISTRY_URL: https://datahub-gms:8443/schema-registry/api/
      # SystemUpdate는 Spring Kafka의 arbitrary client properties를 통해 Confluent
      # Schema Registry serializer를 만든다. 이 접두사 없이 truststore를 주입하면
      # serializer가 JVM 기본 CA만 사용해 private-CA HTTPS endpoint를 거절한다.
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_SECURITY_PROTOCOL: SSL
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /run/secrets/datahub-truststore.p12
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: ${DATAHUB_TLS_TRUSTSTORE_PASSWORD:?DATAHUB_TLS_TRUSTSTORE_PASSWORD is required}
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_SSL_TRUSTSTORE_TYPE: PKCS12
      # GMS KafkaConfiguration 경로도 독립적으로 Schema Registry client를 만든다.
      # 동일 파일을 JKS 기본값으로 해석하면 trust anchor가 비어 TLS 검증이 실패한다.
      KAFKA_SCHEMA_REGISTRY_SECURITY_PROTOCOL: SSL
      KAFKA_SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /run/secrets/datahub-truststore.p12
      KAFKA_SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: ${DATAHUB_TLS_TRUSTSTORE_PASSWORD:?DATAHUB_TLS_TRUSTSTORE_PASSWORD is required}
      KAFKA_SCHEMA_REGISTRY_SSL_TRUSTSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_SYSTEM_UPDATE: "true"
      SCHEMA_REGISTRY_TYPE: KAFKA
      USE_CONFLUENT_SCHEMA_REGISTRY: "false"
    volumes:
      - ${DATAHUB_TLS_TRUSTSTORE_HOST_FILE:?DATAHUB_TLS_TRUSTSTORE_HOST_FILE is required}:/run/secrets/datahub-truststore.p12:ro

  datahub-gms-quickstart:
    <<: *datahub-service
    image: acryldata/datahub-gms:v1.7.0@sha256:54bc4431402846a72d1c1bdb69fae1148f74a59425144aa947fdf1c3506461f7
    hostname: datahub-gms
    depends_on:
      kafka-broker: {condition: service_healthy}
      mysql: {condition: service_healthy}
      opensearch: {condition: service_healthy}
    environment:
      DATAHUB_SERVER_TYPE: prod
      DATAHUB_OBJECT_STORAGE_URI: file:///tmp/datahub-object-storage
      DATAHUB_TELEMETRY_ENABLED: "false"
      DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID: generic-duhe-consumer-job-client-gms
      DATAHUB_VERSION: v1.7.0
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT}
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY}
      DATAHUB_SYSTEM_CLIENT_ID: ${DATAHUB_SYSTEM_CLIENT_ID:-__datahub_system}
      DATAHUB_SYSTEM_CLIENT_SECRET: ${DATAHUB_SYSTEM_CLIENT_SECRET:?DATAHUB_SYSTEM_CLIENT_SECRET is required}
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      EBEAN_DATASOURCE_HOST: mysql:3306
      EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_MYSQL_PASSWORD}
      EBEAN_DATASOURCE_URL: jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2
      EBEAN_DATASOURCE_USERNAME: datahub
      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      GRAPH_SERVICE_IMPL: elasticsearch
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      KAFKA_SCHEMAREGISTRY_URL: https://datahub-gms:8443/schema-registry/api/
      # GMS의 MCE/MCP producer도 SystemUpdate와 별도로 Schema Registry client를
      # 생성한다. private CA truststore를 이 경로에 직접 전달하지 않으면 aspect
      # 직렬화가 PKIX 오류로 중단되어 정상 GraphQL mutation조차 저장되지 않는다.
      KAFKA_SCHEMA_REGISTRY_SECURITY_PROTOCOL: SSL
      KAFKA_SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /run/secrets/datahub-truststore.p12
      KAFKA_SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: ${DATAHUB_TLS_TRUSTSTORE_PASSWORD:?DATAHUB_TLS_TRUSTSTORE_PASSWORD is required}
      KAFKA_SCHEMA_REGISTRY_SSL_TRUSTSTORE_TYPE: PKCS12
      # Status·policy mutation은 Spring Kafka producer 경로를 사용하므로 같은 CA를
      # Spring의 arbitrary client-property namespace에도 전달한다.
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_SECURITY_PROTOCOL: SSL
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /run/secrets/datahub-truststore.p12
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: ${DATAHUB_TLS_TRUSTSTORE_PASSWORD:?DATAHUB_TLS_TRUSTSTORE_PASSWORD is required}
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_SSL_TRUSTSTORE_TYPE: PKCS12
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      METADATA_SERVICE_AUTH_ENABLED: "true"
      METADATA_SERVICE_AUTH_ENFORCE_EXISTENCE_ENABLED: "true"
      METADATA_SERVICE_AUTHENTICATOR_EXCEPTIONS_ENABLED: "true"
      GUEST_AUTHENTICATION_ENABLED: "false"
      AUTH_POLICIES_ENABLED: "true"
      REST_API_AUTHORIZATION_ENABLED: "true"
      SECRET_SERVICE_ENCRYPTION_KEY: ${DATAHUB_SECRET_SERVICE_ENCRYPTION_KEY:?DATAHUB_SECRET_SERVICE_ENCRYPTION_KEY is required}
      MCL_CONSUMER_BATCH_ENABLED: "true"
      MCP_CONSUMER_BATCH_ENABLED: "true"
      PE_CONSUMER_ENABLED: "true"
      SCHEMA_REGISTRY_TYPE: INTERNAL
      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/run/secrets/datahub-gms-keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${DATAHUB_TLS_KEYSTORE_PASSWORD:?DATAHUB_TLS_KEYSTORE_PASSWORD is required}
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
    ports:
      - "127.0.0.1:${DATAHUB_MAPPED_GMS_PORT:-18081}:8443"
      - "127.0.0.1:${DATAHUB_MAPPED_GMS_MANAGEMENT_PORT:-14319}:4319"
    volumes:
      - ${DATAHUB_TLS_KEYSTORE_HOST_FILE:?DATAHUB_TLS_KEYSTORE_HOST_FILE is required}:/run/secrets/datahub-gms-keystore.p12:ro
      - ${DATAHUB_TLS_TRUSTSTORE_HOST_FILE:?DATAHUB_TLS_TRUSTSTORE_HOST_FILE is required}:/run/secrets/datahub-truststore.p12:ro
      - ${DATAHUB_TLS_CA_HOST_FILE:?DATAHUB_TLS_CA_HOST_FILE is required}:/run/secrets/datahub-ca.pem:ro
    healthcheck:
      # GMS는 SystemUpdate 전에는 /health를 503으로 반환하지만 HTTPS listener와
      # private-CA 검증은 이미 가능하다. 이 liveness가 SystemUpdate의 선행 조건이고,
      # UI/Actions의 실제 readiness는 SystemUpdate 완료 의존성으로 별도 보장한다.
      test: ["CMD-SHELL", "status=$$(curl --cacert /run/secrets/datahub-ca.pem -sS -o /dev/null -w '%{http_code}' https://datahub-gms:8443/health); test \"$$status\" = 200 -o \"$$status\" = 503"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  datahub-actions-quickstart:
    <<: *datahub-service
    image: acryldata/datahub-actions:v1.7.0-slim@sha256:4ca86e3bdbba4c5e24421cae8dc7ac7c19d1b094c1418f36f607cd437265fb74
    depends_on:
      datahub-gms-quickstart: {condition: service_healthy}
      system-update-quickstart: {condition: service_completed_successfully}
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8443"
      DATAHUB_GMS_PROTOCOL: https
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      DATAHUB_SYSTEM_CLIENT_ID: ${DATAHUB_SYSTEM_CLIENT_ID:-__datahub_system}
      DATAHUB_SYSTEM_CLIENT_SECRET: ${DATAHUB_SYSTEM_CLIENT_SECRET:?DATAHUB_SYSTEM_CLIENT_SECRET is required}
      METADATA_SERVICE_AUTH_ENABLED: "true"
      REQUESTS_CA_BUNDLE: /run/secrets/datahub-ca.pem
      CURL_CA_BUNDLE: /run/secrets/datahub-ca.pem
      DATAHUB_VERSION: v1.7.0
    volumes:
      - ${DATAHUB_TLS_CA_HOST_FILE:?DATAHUB_TLS_CA_HOST_FILE is required}:/run/secrets/datahub-ca.pem:ro

  frontend-quickstart:
    <<: *datahub-service
    image: acryldata/datahub-frontend-react:v1.7.0@sha256:f8f94d246d6d7c93eb3de6a9d625af4f1574e2ced28629b972429de3e2c2bf6a
    depends_on:
      datahub-gms-quickstart: {condition: service_healthy}
      system-update-quickstart: {condition: service_completed_successfully}
    environment:
      DATAHUB_APP_VERSION: v1.7.0
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8443"
      DATAHUB_GMS_USE_SSL: "true"
      DATAHUB_GMS_SSL_TRUSTSTORE_PATH: /run/secrets/datahub-truststore.p12
      DATAHUB_GMS_SSL_TRUSTSTORE_PASSWORD: ${DATAHUB_TLS_TRUSTSTORE_PASSWORD:?DATAHUB_TLS_TRUSTSTORE_PASSWORD is required}
      DATAHUB_GMS_SSL_TRUSTSTORE_TYPE: PKCS12
      DATAHUB_SYSTEM_CLIENT_ID: ${DATAHUB_SYSTEM_CLIENT_ID:-__datahub_system}
      DATAHUB_SYSTEM_CLIENT_SECRET: ${DATAHUB_SYSTEM_CLIENT_SECRET:?DATAHUB_SYSTEM_CLIENT_SECRET is required}
      METADATA_SERVICE_AUTH_ENABLED: "true"
      GUEST_AUTHENTICATION_ENABLED: "false"
      DATAHUB_SECRET: ${DATAHUB_SECRET}
      DATAHUB_VERSION: v1.7.0
    ports:
      - "127.0.0.1:${DATAHUB_MAPPED_FRONTEND_PORT:-19002}:9002"
    volumes:
      - ${DATAHUB_TLS_TRUSTSTORE_HOST_FILE:?DATAHUB_TLS_TRUSTSTORE_HOST_FILE is required}:/run/secrets/datahub-truststore.p12:ro

networks:
  datahub-network: {}

volumes:
  datahub-kafka-data: {}
  datahub-mysql-data: {}
  datahub-opensearch-data: {}
