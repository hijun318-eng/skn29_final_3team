    logical_type: time
    nullable: false
    pii_type: NONE
    semantic_role: attribute
    sensitivity: INTERNAL
  - authoring_is_part_of_key: false
    column_name: quoted_at
    data_type: TIMESTAMP WITH TIME ZONE
    description: 견적을 제시한 시각. 문의 종료는 NULL
    key_role: NONE
    logical_type: time
    nullable: true
    pii_type: NONE
    semantic_role: attribute
    sensitivity: INTERNAL
  - authoring_is_part_of_key: false
    column_name: confirmed_at
    data_type: TIMESTAMP WITH TIME ZONE
