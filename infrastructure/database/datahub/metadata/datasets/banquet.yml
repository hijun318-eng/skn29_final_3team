  business_name: 연회 예약
  columns:
  - authoring_is_part_of_key: true
    column_name: banquet_event_id
    data_type: VARCHAR(64)
    description: 연회 예약의 결정적 합성 식별자
    key_role: PRIMARY_KEY
    logical_type: string
    nullable: false
    pii_type: NONE
    semantic_role: identifier
    sensitivity: INTERNAL
  - authoring_is_part_of_key: false
    column_name: banquet_customer_id
    data_type: VARCHAR(40)
