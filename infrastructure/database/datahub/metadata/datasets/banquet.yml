    logical_type: string
    nullable: false
    pii_type: NONE
    semantic_role: attribute
    sensitivity: INTERNAL
  - authoring_is_part_of_key: false
    column_name: starts_at
    data_type: TIMESTAMP WITH TIME ZONE
