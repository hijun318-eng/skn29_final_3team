    key_role: NONE
    logical_type: time
    nullable: true
    pii_type: NONE
    semantic_role: attribute
    sensitivity: INTERNAL
  - authoring_is_part_of_key: false
    column_name: cancelled_at
    data_type: TIMESTAMP WITH TIME ZONE
