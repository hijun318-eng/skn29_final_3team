        interval: '[start,end)'
        semantics: BUSINESS_DATE
        timezone: Asia/Seoul
      visibility: BUSINESS
    id: adr
    reduction: ratio
    required_filters: []
    result_field: adr_krw
    source:
      denominator_metric_id: occupied_room_nights
      kind: ratio
      numerator_metric_id: room_revenue
      zero_policy: null_on_zero_denominator
    time_field: null
    unit: KRW_per_occupied_room_night
