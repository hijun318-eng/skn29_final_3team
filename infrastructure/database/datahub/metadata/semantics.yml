    denominator_metric_id: occupied_room_nights
    kind: ratio
    numerator_metric_id: room_revenue
    zero_policy: null_on_zero_denominator
  grain:
    dimensions:
    - hotel_code
    keys:
    - business_date
    - hotel_code
    kind: periodic
  lifecycle: DRAFT
  metric_id: adr
  null_policy: SQL_AGGREGATE_IGNORE_NULLS
  owner_group_urn: urn:li:corpGroup:answervice_runtime_stewards
  required_filters: []
  runtime_rule:
    aggregation: ratio
    dimensions: []
    governance:
      grain:
        dimensions:
