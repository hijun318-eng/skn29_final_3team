source:
  type: mssql
  config:
    host_port: crm-mssql:1433
    database: ${CRM_DB_NAME}
    username: ${CRM_READONLY_USER}
    password: ${CRM_READONLY_PASSWORD}
    platform_instance: crm
    include_jobs: false
    schema_pattern:
      allow:
        - dbo
sink:
  type: datahub-rest
  config:
    server: http://datahub-gms-quickstart:8080
    token: ${DATAHUB_INGESTION_TOKEN}
transformers:
  - type: simple_add_dataset_domain
    config:
      domains: ["urn:li:domain:membership"]
  - type: simple_add_dataset_tags
    config:
      tag_urns: ["urn:li:tag:AI_SEARCH_ALLOWED"]
  - type: simple_add_ownership
    config:
      owner_urns: ["urn:li:corpuser:membership_operations"]
      entity_types: ["dataset"]
