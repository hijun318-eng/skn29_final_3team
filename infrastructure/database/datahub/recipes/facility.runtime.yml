# 책임: ClickHouse facility database의 현재 relation metadata를 동적으로 발행한다.
# database 탐색이나 sink write 실패는 semantic bootstrap을 차단한다.
source:
  type: clickhouse
  config:
    host_port: ${FACILITY_DATAHUB_HOST_PORT}
    database: ${FACILITY_DATAHUB_DATABASE}
    username: ${FACILITY_READONLY_USER}
    password: ${FACILITY_READONLY_PASSWORD}
    env: ${DATAHUB_DATASET_ENV}
    platform_instance: ${FACILITY_DATAHUB_PLATFORM_INSTANCE}
transformers:
  # DataHub 1.7 SQL source는 incremental_properties를 노출하지 않는다. PATCH semantics는
  # 의미 custom property를 보존하면서 connector가 소유한 schemaMetadata만 갱신하므로,
  # schema drift는 read-back 시점에 그대로 의미 release를 무효화한다.
  - type: simple_add_dataset_properties
    config:
      semantics: PATCH
      replace_existing: false
      properties: {}
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_PUBLISH_API_TOKEN}
    ca_certificate_path: ${DATAHUB_TLS_CA_FILE}
