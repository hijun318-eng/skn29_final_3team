# 책임: POS MySQL에서 지정된 runtime database의 현재 schema를 발견해 수집한다.
# source 연결 또는 DataHub 발행이 불완전하면 후속 semantic 작업을 허용하지 않는다.
source:
  type: mysql
  config:
    host_port: ${POS_DATAHUB_HOST_PORT}
    database: ${POS_DATAHUB_DATABASE}
    username: ${POS_READONLY_USER}
    password: ${POS_READONLY_PASSWORD}
    env: ${DATAHUB_DATASET_ENV}
    platform_instance: ${POS_DATAHUB_PLATFORM_INSTANCE}
transformers:
  # DataHub 1.7 SQL source는 incremental_properties를 노출하지 않는다. PATCH semantics는
  # 의미 custom property를 보존하면서 connector가 소유한 schemaMetadata만 갱신하므로,
  # schema drift는 read-back 시점에 그대로 의미 release를 무효화한다.
  - type: simple_add_dataset_properties
    config:
      semantics: PATCH
      replace_existing: false
      properties: {}
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_PUBLISH_API_TOKEN}
    ca_certificate_path: ${DATAHUB_TLS_CA_FILE}
