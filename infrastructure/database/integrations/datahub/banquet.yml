source:
  type: postgres
  config:
    host_port: banquet-postgres:5432
    database: hotel_banquet
    username: banquet_datahub
    password: ${BANQUET_DATAHUB_PASSWORD}
    platform_instance: banquet
    include_tables: true
    include_views: true
    include_query_lineage: false
    include_usage_statistics: false
    profiling:
      enabled: false
    schema_pattern:
      allow:
        - public
pipeline_name: hotel-banquet-metadata
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_TOKEN}
