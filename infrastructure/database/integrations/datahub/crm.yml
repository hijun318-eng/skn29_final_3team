source:
  type: mssql
  config:
    host_port: crm-mssql:1433
    database: hotel_crm
    username: crm_datahub
    password: ${CRM_DATAHUB_PASSWORD}
    platform_instance: crm
    convert_urns_to_lowercase: true
    convert_column_urns_to_lowercase: true
    include_tables: true
    include_views: true
    include_query_lineage: false
    include_usage_statistics: false
    profiling:
      enabled: false
pipeline_name: hotel-crm-metadata
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_TOKEN}
