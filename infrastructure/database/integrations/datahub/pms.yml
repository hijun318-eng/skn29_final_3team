source:
  type: postgres
  config:
    host_port: pms-postgres:5432
    database: hotel_pms
    username: pms_datahub
    password: ${PMS_DATAHUB_PASSWORD}
    platform_instance: pms
    include_tables: true
    include_views: true
    include_query_lineage: false
    include_usage_statistics: false
    profiling:
      enabled: false
    schema_pattern:
      allow:
        - public
pipeline_name: hotel-pms-metadata
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_TOKEN}
