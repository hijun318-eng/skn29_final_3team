source:
  type: mysql
  config:
    host_port: pos-mysql:3306
    database: hotel_pos
    username: pos_datahub
    password: ${POS_DATAHUB_PASSWORD}
    platform_instance: pos
    include_tables: true
    include_views: true
    include_query_lineage: false
    include_usage_statistics: false
    profiling:
      enabled: false
pipeline_name: hotel-pos-metadata
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_TOKEN}
