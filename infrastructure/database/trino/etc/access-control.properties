# 책임: file 기반 system access control을 유일한 Trino 권한 판정기로 활성화한다.
# rules 파일을 읽지 못하면 permissive fallback 없이 query를 거절한다.
# This policy is fail-closed: the final rules in each section deny access not
# granted to a named platform/runtime role. Dataset names are intentionally not
# listed, so newly governed relations do not require a code release.
access-control.name=file
security.config-file=etc/access-control-rules.json
