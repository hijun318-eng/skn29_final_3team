# 책임: banquet PostgreSQL catalog를 read-only principal로 연결한다. 외부 주입
# 계정이 없거나 source가 응답하지 않으면 catalog query를 실패시킨다.
connector.name=postgresql
connection-url=jdbc:postgresql://banquet-postgres:5432/banquet_db
connection-user=${ENV:BANQUET_READONLY_USER}
connection-password=${ENV:BANQUET_READONLY_PASSWORD}
