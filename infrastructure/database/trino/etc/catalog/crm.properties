# 책임: CRM SQL Server catalog 연결에 전용 query principal만 사용한다. 연결 정보나
# 자격증명이 유효하지 않으면 다른 identity로 재시도하지 않는다.
connector.name=sqlserver
connection-url=jdbc:sqlserver://answervice-crm-source:1433;databaseName=crm_db;encrypt=false
connection-user=${ENV:CRM_READONLY_USER}
connection-password=${ENV:CRM_READONLY_PASSWORD}
