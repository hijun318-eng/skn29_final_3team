# 책임: facility ClickHouse metadata와 데이터를 read-only 경로로 노출한다. source
# 또는 환경 주입 credential이 없으면 해당 catalog를 준비 상태로 간주하지 않는다.
connector.name=clickhouse
connection-url=jdbc:clickhouse://answervice-facility-source:8123/
connection-user=${ENV:FACILITY_READONLY_USER}
connection-password=${ENV:FACILITY_READONLY_PASSWORD}
clickhouse.map-string-as-varchar=true
unsupported-type-handling=CONVERT_TO_VARCHAR
