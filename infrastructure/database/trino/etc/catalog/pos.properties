# 책임: POS MySQL database를 전용 read-only identity로 연결한다. TLS/접속 계약이
# 맞지 않으면 다른 database나 계정으로 fallback하지 않는다.
connector.name=mysql
connection-url=jdbc:mysql://pos-mysql:3306?useSSL=false&allowPublicKeyRetrieval=true
connection-user=${ENV:POS_READONLY_USER}
connection-password=${ENV:POS_READONLY_PASSWORD}
