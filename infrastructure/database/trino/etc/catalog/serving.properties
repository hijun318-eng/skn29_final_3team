# 책임: 정식 serving View metadata를 재시작 가능한 Iceberg REST catalog에 영속화한다.
# Polaris는 PostgreSQL에 catalog state를, S3-compatible storage에 Iceberg metadata를
# 저장한다. 사용자별 write 권한은 Trino system access control이 집행한다.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://serving-catalog:8181/api/catalog
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:SERVING_CATALOG_CLIENT_ID}:${ENV:SERVING_CATALOG_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.warehouse=answervice_serving
iceberg.rest-catalog.vended-credentials-enabled=true
iceberg.rest-catalog.view-endpoints-enabled=true
iceberg.rest-catalog.http-headers=Polaris-Realm: ANSWERVICE
iceberg.security=SYSTEM
fs.s3.enabled=true
s3.endpoint=http://serving-object-store:9000
s3.path-style-access=true
s3.region=ap-northeast-2
