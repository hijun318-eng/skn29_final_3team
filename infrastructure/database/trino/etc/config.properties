# 책임: Trino coordinator의 query 실행 한계와 discovery 경계를 정의한다. 메모리나
# 실행시간 한도를 넘긴 query는 서버 안정성을 위해 즉시 실패해야 한다.
coordinator=true
node-scheduler.include-coordinator=true
# WHY: 8080은 single-node coordinator가 자신의 discovery service에 등록하는 내부
# listener다. host에는 publish하지 않으며 shared-secret이 node 요청을 인증하고,
# 일반 client 인증은 아래 allow-insecure=false 때문에 이 listener에서 거절된다.
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Client 인증은 HTTPS에서만 허용한다. password database와 keystore는 repository가
# 아닌 deployment secret mount이며 shared secret은 coordinator 내부 요청을 인증한다.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/run/secrets/trino-keystore.p12
http-server.https.keystore.key=${ENV:TRINO_TLS_KEYSTORE_PASSWORD}
http-server.authentication.type=PASSWORD
http-server.authentication.allow-insecure-over-http=false
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
query.max-memory=2GB
query.max-memory-per-node=1GB
