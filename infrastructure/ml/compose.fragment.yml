services:
  ml-snapshot-bootstrap:
    profiles: [ml, ml-candidate]
    image: "postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60"
    environment:
      PGHOST: pms-postgres
      PGPORT: "5432"
      PGDATABASE: ${PMS_DB_NAME:-pms_db}
      PGUSER: ${PMS_ADMIN_USER:?PMS_ADMIN_USER is required}
      PGPASSWORD: ${PMS_ADMIN_PASSWORD:?PMS_ADMIN_PASSWORD is required}
      PMS_READONLY_USER: ${PMS_READONLY_USER:?PMS_READONLY_USER is required}
      ML_SNAPSHOT_WRITER_ROLE: ${ML_SNAPSHOT_WRITER_ROLE:-ml_snapshot_writer}
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        psql -v ON_ERROR_STOP=1
        -v readonly_role="$${PMS_READONLY_USER}"
        -v snapshot_writer_role="$${ML_SNAPSHOT_WRITER_ROLE}"
        -f /sql/03_room_demand_point_in_time_snapshot_store.sql
    volumes:
      - ../ml/sql/03_room_demand_point_in_time_snapshot_store.sql:/sql/03_room_demand_point_in_time_snapshot_store.sql:ro
    networks: [database-network]
    depends_on:
      pms-postgres:
        condition: service_healthy
    restart: "no"

  ml-candidate-data-bootstrap:
    profiles: [ml-candidate]
    image: "postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60"
    environment:
      PGHOST: pms-postgres
      PGPORT: "5432"
      PGDATABASE: ${PMS_DB_NAME:-pms_db}
      PGUSER: ${PMS_ADMIN_USER:?PMS_ADMIN_USER is required}
      PGPASSWORD: ${PMS_ADMIN_PASSWORD:?PMS_ADMIN_PASSWORD is required}
      PMS_READONLY_USER: ${PMS_READONLY_USER:?PMS_READONLY_USER is required}
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        psql -v ON_ERROR_STOP=1
        -v readonly_role="$${PMS_READONLY_USER}"
        -f /sql/01_room_demand_history_v43_synthetic.sql
        && psql -v ON_ERROR_STOP=1
        -v readonly_role="$${PMS_READONLY_USER}"
        -f /sql/02_room_demand_point_in_time_signals_v43_synthetic.sql
    volumes:
      - ../ml/sql/01_room_demand_history_v43_synthetic.sql:/sql/01_room_demand_history_v43_synthetic.sql:ro
      - ../ml/sql/02_room_demand_point_in_time_signals_v43_synthetic.sql:/sql/02_room_demand_point_in_time_signals_v43_synthetic.sql:ro
    networks: [database-network]
    depends_on:
      pms-postgres:
        condition: service_healthy
    restart: "no"

  ml-runtime:
    # Trino가 필요한 추가 profile이므로 full 또는 split-host와 함께 활성화한다.
    profiles: [ml, ml-candidate]
    container_name: answervice-ml-runtime
    build:
      context: ../..
      dockerfile: infrastructure/ml/Dockerfile
    image: answervice-ml-runtime:room-demand-operational-v4.0-synthetic-candidate-20260901
    environment:
      ML_MODEL_ARTIFACT: /app/src/ml/artifacts/room-demand-operational-hgbr-v4.0.0/model.joblib
      ML_MODEL_MANIFEST: /app/src/ml/artifacts/room-demand-operational-hgbr-v4.0.0/model_manifest.json
      ML_MODEL_APPROVAL: /app/src/ml/artifacts/room-demand-operational-hgbr-v4.0.0/model.approval.json
      ML_FEATURE_CONTRACT: /app/src/ml/artifacts/room-demand-operational-hgbr-v4.0.0/feature_contract.json
      ML_RUNTIME_HMAC_SECRET: ${ML_RUNTIME_HMAC_SECRET:-}
      # observed ML_HISTORY_TABLE is required; runtime preflight rejects an empty value.
      ML_HISTORY_TABLE: ${ML_HISTORY_TABLE:-}
      ML_SIGNAL_TABLE: ${ML_SIGNAL_TABLE:-pms.ml_evaluation.room_demand_point_in_time_signals_observed}
      ML_ALLOW_CONDITIONAL: ${ML_ALLOW_CONDITIONAL:-false}
      ML_RUNTIME_MAX_HORIZON_DAYS: ${ML_RUNTIME_MAX_HORIZON_DAYS:-7}
      TRINO_URL: ${TRINO_URL:-https://trino:8443}
      TRINO_USER: ${TRINO_RUNTIME_USER:?TRINO_RUNTIME_USER is required}
      TRINO_PASSWORD: ${TRINO_RUNTIME_PASSWORD:?TRINO_RUNTIME_PASSWORD is required}
      TRINO_CA_FILE: /run/secrets/trino-ca.pem
      TZ: Asia/Seoul
    volumes:
      - ${TRINO_TLS_CA_HOST_FILE:?TRINO_TLS_CA_HOST_FILE is required}:/run/secrets/trino-ca.pem:ro
    ports:
      - "${ML_RUNTIME_BIND_ADDRESS:-127.0.0.1}:${ML_RUNTIME_BIND_PORT:-18094}:8000"
    networks:
      database-network:
        aliases:
          - ml-runtime
    depends_on:
      trino:
        condition: service_healthy
      ml-snapshot-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readiness', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    restart: unless-stopped

networks:
  database-network: {}
