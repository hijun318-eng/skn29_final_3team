# 조건부 metadata read model 전용이다. root compose에 include하지 않으므로
# 명시적 -f와 neo4j profile 없이는 기존 서비스 DAG에 참여하지 않는다.
name: ${NEO4J_COMPOSE_PROJECT_NAME:-answervice-neo4j}

services:
  neo4j:
    profiles: [neo4j]
    image: neo4j:2026.07.1@sha256:dbc377fb9cd8fe8dabc19d3041b197d5ca0ef8bae514cea175b8df265e5b7a76
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-256m}
    ports:
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j-graph-data:/data
    networks:
      - neo4j-graph-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          password="$${NEO4J_AUTH#*/}";
          cypher-shell -a bolt://127.0.0.1:7687 -u neo4j
          -p "$${password}" "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  neo4j-projector:
    profiles: [neo4j]
    image: answervice-neo4j-projector:${NEO4J_PROJECTOR_IMAGE_TAG:-20260825}
    build:
      context: ../..
      dockerfile: infrastructure/neo4j/Dockerfile.projector
    environment:
      APP_RUNTIME_DATABASE_URL: ${NEO4J_PROJECTION_DATABASE_URL:?NEO4J_PROJECTION_DATABASE_URL is required}
      NEO4J_GRAPH_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_TIMEOUT_SECONDS: ${NEO4J_TIMEOUT_SECONDS:-10}
      NEO4J_POOL_SIZE: ${NEO4J_POOL_SIZE:-2}
      NEO4J_ALLOW_INSECURE: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - neo4j-graph-network
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "on-failure:3"

volumes:
  neo4j-graph-data:

networks:
  neo4j-graph-network:
