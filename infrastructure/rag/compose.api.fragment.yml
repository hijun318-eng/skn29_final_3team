services:
  rag-api:
    profiles: [rag, rag-e2e, full]
    image: answervice-rag-e2e-backend:20260819-orchestration2
    container_name: answervice-rag-api
    build:
      context: ../../tmp/rag-build-context
      dockerfile: infrastructure/rag/Dockerfile
      args:
        RAG_INCLUDE_QWEN: ${RAG_INCLUDE_QWEN:-0}
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-postgresql://${RAG_DB_USER:-rag_local}:${RAG_DB_PASSWORD:-rag-local-dev-password}@rag-postgres:5432/${RAG_DB_NAME:-answervice_rag}}
      RAG_CONFIG_DIR: /workspace/config/rag
      RAG_MANUALS_DIR: /workspace/data/rag/manuals
      RAG_EVIDENCE_DIR: /workspace/evals/runs/rag
      RAG_BACKUP_DIR: /backups/rag
      RAG_MODEL_PATH: /models/${RAG_EMBEDDING_MODEL_DIR:-Qwen3-Embedding-0.6B}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1024}
      OPENAI_EMBEDDING_ENDPOINT: ${OPENAI_EMBEDDING_ENDPOINT:-https://api.openai.com/v1/embeddings}
      RAG_DEVICE: ${RAG_DEVICE:-cpu}
      RAG_SNIPPET_MAX_CHARS: ${RAG_SNIPPET_MAX_CHARS:-1800}
      RAG_ANSWER_ENDPOINT: ${RAG_ANSWER_ENDPOINT:-http://rag-local-answer:8001/v1/chat/completions}
      RAG_ANSWER_MODEL: ${RAG_ANSWER_MODEL:-rag-local-answer-v1}
      RAG_ANSWER_API_KEY: ${RAG_ANSWER_API_KEY:-rag-local-no-secret}
      RAG_GATEWAY_HMAC_SECRET: ${RAG_GATEWAY_HMAC_SECRET:-rag-local-dev-hmac-secret-change-before-shared-use}
    volumes:
      - "${RAG_MODELS_DIR:-../rag/models}:/models:ro"
      - "${RAG_MANUALS_HOST_DIR:-../../data/rag/manuals}:/workspace/data/rag/manuals:ro"
      - "${RAG_BACKUPS_DIR:-../../backups/rag}:/backups/rag"
    depends_on:
      rag-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - database-network

  rag-e2e:
    profiles: [rag-e2e]
    image: answervice-rag-e2e-backend:20260819-orchestration2
    build:
      context: ../../tmp/rag-build-context
      dockerfile: infrastructure/rag/Dockerfile
      args:
        RAG_INCLUDE_QWEN: ${RAG_INCLUDE_QWEN:-0}
    environment:
      RAG_E2E_BASE_URL: http://rag-api:8000
      RAG_E2E_GATEWAY_HMAC_SECRET: ${RAG_E2E_GATEWAY_HMAC_SECRET:-rag-local-dev-hmac-secret-change-before-shared-use}
      RAG_E2E_ROLE: ${RAG_E2E_ROLE:-MANAGER}
      RAG_E2E_QUERY: "\uAD00\uB9AC\uC790 \uBCF4\uACE0\uC11C \uBE14\uB85D \uAD6C\uC131 \uAE30\uC900"
      RAG_E2E_TOP_K: ${RAG_E2E_TOP_K:-3}
      RAG_E2E_ARTIFACT_DIR: /workspace/evals/runs/rag
    volumes:
      - "${RAG_MODELS_DIR:-../rag/models}:/models:ro"
      - "${RAG_BACKUPS_DIR:-../../backups/rag}:/backups/rag"
    depends_on:
      rag-api:
        condition: service_healthy
    entrypoint: ["python", "-m", "src.rag.e2e.manual_rag_e2e"]
    restart: "no"
    networks:
      - database-network

  rag-local-answer:
    profiles: [rag, rag-e2e, full]
    container_name: answervice-rag-local-answer
    image: answervice-rag-e2e-backend:20260819-orchestration2
    entrypoint: ["uvicorn"]
    command: ["src.rag.local_answer_service:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - database-network

networks:
  database-network:
    external: ${RAG_NETWORK_EXTERNAL:-false}
    name: ${RAG_NETWORK_NAME:-answervice-network}
